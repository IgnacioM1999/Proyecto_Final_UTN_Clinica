<div class="p-5 bg-primary text-white text-center">
  <h1 class="fw-bold">Modificar turno</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Estado</th>
          <th>Especialista</th>
          <th>Paciente</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let turno of turnos">
          <td>{{ turno.idTurno }}</td>

          <!-- Fecha -->
          <td>
            <input type="date" [(ngModel)]="turno.fecha" class="form-control">
          </td>

          <!-- Hora -->
          <td>
            <input type="time" [(ngModel)]="turno.horario" class="form-control">
          </td>

          <!--Estado-->
          <td>
            <select [(ngModel)]="turno.estado" class="form-select">
              <option>Disponible</option>
              <option>Ocupado</option>
              <option>Cancelado</option>
            </select>
          </td>

          <!-- Especialista -->
          <td>
            <select class="form-select" [(ngModel)]="turno.dniEspecialista" name="especialista-{{ turno.idTurno }}">
              <option selected disabled>Seleccione un especialista</option>
              <option *ngFor="let esp of especialistas" [value]="esp.dniUsuario">
                {{ esp.nombreYApellido }}
              </option>
            </select>
          </td>

          <!--Paciente-->
          <td>
            {{ turno.nombrePaciente }}
          </td>

          <!-- Botón Guardar -->
          <td>
            <button class="btn btn-success btn-sm" (click)="guardarTurno(turno)">
              Guardar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-turnos" class="btn btn-secondary">Volver</a>
  </div>
</div>
