<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a [routerLink]="rutaInicio" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Perfil</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg text-center p-4 " style="max-width: 400px; width: 100%; border-radius: 20px;">
    <h2 class="mb-3">Perfil del Usuario</h2>

    <div *ngIf="usuario; else noDatos">
      <p><strong>Nombre y Apellido:</strong> {{ usuario.nombreYApellido }}</p>
      <p><strong>Email:</strong> {{ usuario.mail }}</p>
      <p><strong>Telefono:</strong> {{ usuario.telefono }}</p>
      <p><strong>Usuario:</strong> {{ usuario.nombreUsuario }}</p>
      <p><strong>Rol:</strong> {{ usuario.tipoUsuario }}</p>
    </div>

    <ng-template #noDatos>
      <p>No se encontraron datos de usuario.</p>
    </ng-template>

    <button class="btn btn-warning mt-3" data-bs-toggle="modal" data-bs-target="#modalCambiarContrasenia">
      <i class="bi bi-key me-2"></i> Cambiar Contraseña
    </button>

  </div>
</div>
<div class="text-center mt-4 mb-5">
  <a [routerLink]="rutaInicio" class="btn btn-secondary">
    <i class="bi bi-arrow-left me-2"></i> Volver
  </a>
</div>

<!-- Modal Cambiar Contraseña -->
<div class="modal fade" id="modalCambiarContrasenia" tabindex="-1" aria-labelledby="modalCambiarContraseniaLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCambiarContraseniaLabel">Cambiar Contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body text-start">
        <div class="mb-3">
          <label for="contraseniaActual" class="form-label">Contraseña Actual</label>
          <input [type]="mostrarActual ? 'text' : 'password'" class="form-control" [(ngModel)]="contraseniaActual"
            readonly>
          <span class="input-group-text" style="cursor: pointer;" (click)="mostrarActual = !mostrarActual">
            <i class="bi" [ngClass]="mostrarActual ? 'bi-eye-slash' : 'bi-eye'"></i>
          </span>
        </div>

        <div class="mb-3">
          <label for="nuevaContrasenia" class="form-label">Nueva Contraseña</label>
          <input [type]="mostrarNueva ? 'text' : 'password'" class="form-control" [(ngModel)]="nuevaContrasenia">
          <span class="input-group-text" style="cursor: pointer;" (click)="mostrarNueva = !mostrarNueva">
            <i class="bi" [ngClass]="mostrarNueva ? 'bi-eye-slash' : 'bi-eye'"></i>
          </span>
        </div>

        <div class="mb-3">
          <label for="verificarContrasenia" class="form-label">Verificar Contraseña</label>
          <input [type]="mostrarVerificar ? 'text' : 'password'" class="form-control"
            [(ngModel)]="verificarContrasenia">
          <span class="input-group-text" style="cursor: pointer;" (click)="mostrarVerificar = !mostrarVerificar">
            <i class="bi" [ngClass]="mostrarVerificar ? 'bi-eye-slash' : 'bi-eye'"></i>
          </span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" (click)="guardarNuevaContrasenia()">Guardar</button>
      </div>
    </div>
  </div>
</div>
