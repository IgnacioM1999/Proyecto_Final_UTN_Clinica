<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Crear Especialista</h1>
</div>
<div class="container mt-4">

    <div class="card shadow p-4">
        <!-- Usuario-->
        <div class="mb-4">
            <label for="usuario" class="form-label fw-bold">Usuario</label>
            <input type="text" id="usuario" class="form-control" required>
            <div class="invalid-feedback">
                Por favor ingrese el usuario del especialista.
            </div>
        </div>

        <!-- Nombre-->
        <div class="mb-4">
            <label for="nombreYapellido" class="form-label fw-bold">Nombre y Apellido</label>
            <input type="text" id="nombreYapellido" class="form-control" required>
            <div class="invalid-feedback">
                Por favor ingrese nombre y apellido del especialista.
            </div>
        </div>

        <!-- Legajo-->
        <div class="mb-4">
            <label for="legajo" class="form-label fw-bold">DNI</label>
            <input type="number" id="legajo" class="form-control" required>
            <div class="invalid-feedback">
                Por favor ingrese un legajo.
            </div>
        </div>

        <!-- Email -->
        <div class="mb-4">
            <label for="email" class="form-label fw-bold">Email</label>
            <input type="email" id="email" class="form-control" required>
            <div class="invalid-feedback">
                Por favor ingrese un email valido.
            </div>
        </div>

        <!-- Contraseña -->
        <div class="mb-4">
            <label for="contrasenia" class="form-label fw-bold">Contraseña</label>
            <input type="text" id="contrasenia" class="form-control" required>
            <div class="invalid-feedback">
                Por favor ingrese una contraseña.
            </div>
        </div>

        <!-- Botón de acción -->
        <div class="text-end">
            <button class="btn btn-success">Guardar Especialista</button>
        </div>
    </div>

    <!-- Botón Volver -->
    <div class="mt-3">
        <a routerLink="/admin/gestionar-especialistas" class="btn btn-secondary">Volver</a>
    </div>
</div>
