<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Listar pasantes</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>Legajo</th>
          <th>Nombre y Apellido</th>
          <th>Usuario</th>
          <th>Email</th>
          <th>Contraseña</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pasante of pasantes">
          <td>{{ pasante.legajo }}</td>
          <!-- Nombre -->
          <td>{{pasante.nombreYapellido}}</td>
          <!-- Usuario -->
          <td>{{pasante.usuario}}</td>
          <!-- Email -->
          <td>{{pasante.email}}</td>
          <!--Contraseña-->
          <td>{{pasante.contrasenia}}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-pasantes" class="btn btn-secondary">Volver</a>
  </div>
</div>
