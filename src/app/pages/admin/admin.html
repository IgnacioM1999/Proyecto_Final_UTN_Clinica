<div class="p-5 bg-primary text-white text-center">
  <h1>Panel del Administrador</h1>
</div>
<div class="container text-center mt-5">
  <div class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarTurnos()">Gestionar Turnos</button>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarSesiones()" >Gestionar Sesiones</button>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarEspecialistas()">Gestionar Especialistas</button>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarPasantes()">Gestionar Pasantes</button>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarPacientes()">Gestionar Pacientes</button>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="gestionarInsumos()">Gestionar Insumos</button>
    </div>
        <div class="col-md-4">
      <button class="btn btn-primary w-100" (click)="historialClinico()">Historial Clinico</button>
    </div>
  </div>
  <div class="container mt-5">
    <button type="button" class="btn btn-danger" (click)="salir()">Salir</button>
  </div>
</div>
