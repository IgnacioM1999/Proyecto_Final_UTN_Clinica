  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Crear Turno</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">

<div class="container mt-4">
  <!--<h2 class="mb-4 text-center">Crear Turno</h2>-->

  <div class="card shadow p-4">
    <form (ngSubmit)="guardarTurno()">

      <!-- Selección de Fecha -->
      <div class="mb-4">
        <label for="fecha" class="form-label fw-bold">
          <i class="bi bi-calendar-date"></i> Fecha
        </label>
        <input type="date" id="fecha" class="form-control" [(ngModel)]="nuevoTurno.fecha" name="fecha" required>
      </div>

      <!-- Selección de hora -->
      <div class="mb-4">
        <label for="hora" class="form-label fw-bold">
          <i class="bi bi-clock"></i>Hora
        </label>
        <input type="time" id="hora" class="form-control" [(ngModel)]="nuevoTurno.horario" name="hora" required>
      </div>

      <!-- Asignacion de estado Disponible-->
      <div class="mb-4">
        <label for="estado" class="form-label fw-bold">
          <i class="bi bi-info-circle"></i>Estado
        </label>
        <input type="text" id="estado" class="form-control" [(ngModel)]="nuevoTurno.estado" name="estado" readonly>
      </div>

      <!-- Selección de especialista -->
      <div class="mb-4">
        <label for="especialista" class="form-label fw-bold">
          <i class="bi bi-person-badge"></i> Especialista
        </label>
        <select id="especialista" class="form-select" [(ngModel)]="nuevoTurno.dniEspecialista" name="especialista">
          <option selected disabled>Seleccione un especialista</option>
          <option *ngFor="let esp of especialistas" [value]="esp.dniUsuario">
            {{ esp.nombreYApellido }}
          </option>
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a routerLink="/admin/gestionar-turnos" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
        <button class="btn btn-success" type="submit">
          <i class="bi bi-check-circle"></i> Guardar Turno
        </button>
      </div>
    </form>
  </div>
</div>
