<!-- Sección de Puntos a tratar -->
<div class="container mt-4">
  <div class="card shadow-sm p-3" *ngIf="puntos && puntos.length > 0">
    <h4 class="text-center mb-3 fw-bold text-primary">Puntos a tratar</h4>
    <div class="d-flex flex-wrap justify-content-center gap-3">
      <span
        *ngFor="let punto of puntos"
        class="badge bg-warning text-dark fs-6 px-3 py-2 shadow-sm"
        style="border-radius: 12px;"
      >
        {{ punto.trim() }}
      </span>
    </div>
  </div>

  <div *ngIf="!puntos || puntos.length === 0" class="text-center mt-3 text-muted">
    No se encontraron puntos asignados para este tratamiento.
  </div>
</div>
<div class="container-principal mt-4 text-center">
    <div class="zoom-container" #zoomContainer (wheel)="onWheel($event)" (mousedown)="startDragging($event)"
        (mouseup)="stopDragging()" (mouseleave)="stopDragging()" (mousemove)="onDrag($event)">
        <div class="zoom-wrapper" [style.transform]="
        'translate(' + translateX + 'px,' + translateY + 'px) scale(' + zoom + ')'
      ">
            <img #cuerpoImg src="/assets/img/cuerpo_humano_puntos.jpg" alt="Puntos de acupuntura" class="zoom-image" />
        </div>
    </div>
    <div class="card shadow p-4 mt-4">
        <h3>Insumos Gastados</h3>
        <table class="table table-bordered table-hover mt-3">
            <thead class="table-warning text-center">
                <tr>
                    <th>Insumo</th>
                    <th style="width: 160px;">Disponible</th>
                    <th style="width: 160px;">Cantidad usada</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let insumo of insumos">
                    <td>{{ insumo.nombre }}</td>
                    <td>{{ insumo.cantidad }}</td>
                    <td>
                        <input type="number" [(ngModel)]="insumo.cantidadUsada" (change)="actualizarCantidad(insumo)"
                            min="0" [max]="insumo.cantidad">
                    </td>
                </tr>
            </tbody>
        </table>
        <hr>
        <!--Duracion de la sesion en horas-->
        <h3>Duracion de la Sesión</h3>
        <div class="d-flex justify-content-center">
            <input type="time" class="form-control" [(ngModel)]="duracionSesion" min="00:00" max="01:30" step="300"
            required style="width: 150px">
        </div>
        <hr>

        <!-- Sección de Observaciones -->
        <h3>Observaciones</h3>
        <textarea [(ngModel)]="observaciones" rows="4" cols="60"
            placeholder="Escriba las observaciones del tratamiento...">
        </textarea>
    </div>
    <div class="mt-5 d-flex justify-content-center gap-5">
        <button (click)="volver()" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </button>
        <button class="btn btn-success" (click)="registrar()">
            Registrar <i class="bi bi-check2-circle"></i>
        </button>
    </div>
</div>
