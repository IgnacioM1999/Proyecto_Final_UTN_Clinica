<div class="p-5 bg-primary text-white text-center">
  <h1 class="fw-bold">Crear turno</h1>
</div>
<div class="container mt-4">
  <!--<h2 class="mb-4 text-center">Crear Turno</h2>-->

  <div class="card shadow p-4">
    <!-- Selección de Fecha -->
    <div class="mb-4">
      <label for="fecha" class="form-label fw-bold">Fecha</label>
      <input type="date" id="fecha" class="form-control" [(ngModel)]="nuevoTurno.fecha" name="fecha">
    </div>


    <!-- Selección de hora -->
    <div class="mb-4">
      <label for="hora" class="form-label fw-bold">Hora</label>
      <input type="time" id="hora" class="form-control" [(ngModel)]="nuevoTurno.horario" name="hora">
    </div>

    <!-- Asignacion de estado Disponible-->
    <div class="mb-4">
      <label for="estado" class="form-label fw-bold">Estado</label>
      <input 
        type="text" 
        id="estado" 
        class="form-control" 
        [(ngModel)]="nuevoTurno.estado"
        name="estado"
        readonly
      >
    </div>
    
    <!-- Selección de especialista -->
    <div class="mb-4">
      <label for="especialista" class="form-label fw-bold">Especialista</label>
      <select 
        id="especialista" 
        class="form-select" 
        [(ngModel)]="nuevoTurno.dniEspecialista" 
        name="especialista"
      >
        <option selected disabled>Seleccione un especialista</option>
        <option *ngFor="let esp of especialistas" [value]="esp.dniUsuario">
          {{ esp.nombreYApellido }}
        </option>
      </select>
    </div>

    <!-- Botón de acción -->
    <div class="text-end">
      <button class="btn btn-success" (click)="guardarTurno()">Guardar Turno</button>
    </div>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-turnos" class="btn btn-secondary">Volver</a>
  </div>
</div>
