<div class="d-flex justify-content-center align-items-center login-bg">
    <div class="card shadow p-4"
        style="max-width: 600px; width: 100%; border-radius: 15px; margin-top: 50px; margin-bottom: 50px;">
        <form (ngSubmit)="confirmar()" #registerForm="ngForm">

            <div class="text-center mb-3">
                <h1 class="h3 mb-3 fw-normal">Recuperar Contraseña</h1>
            </div>

            <div class="mb-3">
                <label for="mail">Mail</label>
                <input type="email" class="form-control" [(ngModel)]="usuario.mail" name="mail"
                    pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$" required #mailCtrl="ngModel" [ngClass]="{
          'is-invalid': mailCtrl.invalid && (mailCtrl.dirty || mailCtrl.touched),
          'is-valid': mailCtrl.valid && (mailCtrl.dirty || mailCtrl.touched)}">
                <div class="invalid-feedback">
                    Introduzca un mail válido
                </div>
            </div>

            <div class="mb-3">
                <label for="nombreUsuario">Nombre de Usuario</label>
                <input id="nombreUsuario" type="text" class="form-control" [(ngModel)]="usuario.nombreUsuario"
                    name="nombreUsuario" required minlength="4" #usuarioCtrl="ngModel"
                    (ngModelChange)="verificarNombreUsuario()" [ngClass]="{
            'is-invalid': usuarioCtrl.invalid && (usuarioCtrl.dirty || usuarioCtrl.touched),
            'is-valid': usuarioCtrl.valid && (usuarioCtrl.dirty || usuarioCtrl.touched)
          }">
                <div class="invalid-feedback"
                    *ngIf="usuarioCtrl.errors?.['required'] || usuarioCtrl.errors?.['pattern']">
                    Introduza un nombre de usuario con al menos 4 caracteres.
                </div>
            </div>

            <!-- Botón de enviar -->
            <button class="btn btn-success w-100 mt-3" type="submit"
                [disabled]="!registerForm.form.valid">
                Confirmar
            </button>

            <button class="btn btn-secondary w-100 mt-3" (click)="volver()">Volver</button>
        </form>
    </div>
</div>
