<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Listar turnos</h1>
</div>
<div class="container mt-4">
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Día</th>
        <th>Hora</th>
        <th>Especialista</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let turno of turnos">
        <td>{{ turno.id }}</td>
        <td>{{ turno.dia }}</td>
        <td>{{ turno.hora }}</td>
        <td>{{ turno.especialista }}</td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-secondary mt-3" routerLink="/admin/gestionar-turnos">
    Volver
  </button>
</div>
