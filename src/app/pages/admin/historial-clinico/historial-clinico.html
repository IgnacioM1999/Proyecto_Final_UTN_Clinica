<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<!-- Título -->
<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
            <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
                style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
        </a>

        <div class="position-absolute top-50 start-50 translate-middle">
            <span class="fw-bold fs-4 text-center">Historial Clínico</span>
        </div>

        <div class="d-flex align-items-center ms-auto">
            <a routerLink="/perfil" class="text-decoration-none">
                <img src="usuario.png" alt="Perfil" width="60" height="60">
            </a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="card shadow p-4" style="width: 800px; margin: 0 auto;">
        <div class="mb-3 d-flex align-items-center gap-2">
            <label for="nombrePacienteFiltro" class="form-label fw-bold mb-0">Nombre Paciente:</label>
            <input type="text" id="nombrePacienteFiltro" [(ngModel)]="nombrePacienteFiltro" class="form-control"
                style="max-width: 200px;">

            <button class="btn btn-primary" (click)="filtrarPacientes()">Filtrar</button>
            <button class="btn btn-secondary" (click)="limpiarFiltroPacientes()">Limpiar</button>
        </div>
        <div style="width: 500px; margin: 0 auto;">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-warning text-center">
                    <tr>
                        <th style="width: 120px;">DNI</th>
                        <th>Nombre y Apellido</th>
                        <th style="width: 120px;">Seleccionar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let paciente of pacientesFiltrados">
                        <!--DNI-->
                        <td>{{ paciente.dniPaciente }}</td>
                        <!-- Nombre -->
                        <td>{{paciente.nombreYApellido}}</td>
                        <!-- Seleccionar Paciente -->
                        <td class="text-center align-middle">
                            <input class="form-check-input" type="radio" name="pacienteSeleccionado"
                                (change)="pacienteDniSeleccionado = paciente.dniPaciente">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!--Botones-->
    <div class="mt-5 d-flex justify-content-center gap-5">
        <button class="btn btn-secondary" routerLink="/admin">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </button>
        <button class="btn btn-primary" [routerLink]="['/admin/historial-clinico',pacienteDniSeleccionado]"
            [disabled]="!pacienteDniSeleccionado">
            Continuar <i class="bi bi-arrow-right"></i>
        </button>

    </div>

</div>
