<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Listar sesiones</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>Id Sesion</th>
          <th>Paciente</th>
          <th>Especialista</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sesion of sesiones">
          <!--Id sesion-->  
          <td>{{sesion.idSesion }}</td>
          <!-- Paciente-->
          <td>{{sesion.nomApePaciente}}</td>
          <!-- Especialista -->
          <td>{{sesion.nomApeEspecialista}}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-sesiones" class="btn btn-secondary">Volver</a>
  </div>
</div>
