<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Modificar turno</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Día</th>
          <th>Hora</th>
          <th>Especialista</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let turno of turnos">
          <td>{{ turno.id }}</td>

          <!-- Día -->
          <td>
            <select [(ngModel)]="turno.dia" class="form-select">
              <option>Lunes</option>
              <option>Martes</option>
              <option>Miércoles</option>
              <option>Jueves</option>
              <option>Viernes</option>
            </select>
          </td>

          <!-- Hora -->
          <td>
            <input type="time" [(ngModel)]="turno.hora" class="form-control">
          </td>

          <!-- Especialista -->
          <td>
            <select [(ngModel)]="turno.especialista" class="form-select">
              <option>Dr. Juan Pérez</option>
              <option>Lic. Ana Gómez</option>
              <option>Dr. Carlos Rodríguez</option>
            </select>
          </td>

          <!-- Botón Guardar -->
          <td>
            <button class="btn btn-success btn-sm" (click)="guardarTurno(turno)">
              Guardar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-turnos" class="btn btn-secondary">Volver</a>
  </div>
</div>
