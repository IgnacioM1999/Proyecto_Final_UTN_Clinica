<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a routerLink="/especialista" class="navbar-brand d-flex align-items-center">
            <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
                style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
        </a>

        <div class="position-absolute top-50 start-50 translate-middle">
            <span class="fw-bold fs-4 text-center">Mostrar Tratamientos</span>
        </div>

        <div class="d-flex align-items-center ms-auto">
            <a routerLink="/perfil" class="text-decoration-none">
                <img src="usuario.png" alt="Perfil" width="60" height="60">
            </a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="card shadow p-4">
        <h2>Tratamientos para: {{ descripcionSindrome }}</h2>

        <table class="table table-bordered table-hover mt-3">
            <thead class="table-warning text-center">
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Puntos</th>
                    <th>Seleccionar</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let tratamiento of tratamientos">
                    <td>{{ tratamiento.nombre }}</td>
                    <td>{{ tratamiento.descripcion }}</td>
                    <td>{{ tratamiento.puntos }}</td>
                    <td>
                        <input type="checkbox" [checked]="tratamientoSeleccionado?.idTratamiento === tratamiento.idTratamiento" (change)="onCheckboxChange(tratamiento, $event)">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="mt-5 d-flex justify-content-center gap-5">
        <button (click)="volver()"
            class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </button>
        <button class="btn btn-primary" [disabled]="botonDeshabilitado" (click)="continuar()">
            Continuar <i class="bi bi-arrow-right"></i>
        </button>
    </div>
</div>
