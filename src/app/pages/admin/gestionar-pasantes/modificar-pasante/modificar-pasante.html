<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Modificar pasante</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>Legajo</th>
          <th>Usuario</th>
          <th>Nombre y apellido</th>
          <th>Email</th>
          <th>Contraseña</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pasante of pasantes">
          <td>{{ pasante.legajo }}</td>

          <!-- Usuario -->
          <td>
            <input type="text" [(ngModel)]="pasante.usuario" class="form-control">
          </td>

          <!-- Nombre y Apellido -->
          <td>
            <input type="text" [(ngModel)]="pasante.nombreYapellido" class="form-control">
          </td>

          <!-- Email -->
          <td>
            <input [(ngModel)]="pasante.email" class="form-select">
          </td>

          <!-- Contraseña -->
          <td>
            <input [(ngModel)]="pasante.contrasenia" class="form-select">
          </td>

          <!-- Botón Guardar -->
          <td>
            <button class="btn btn-success btn-sm" (click)="guardarPasante(pasante)">
              Guardar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-pasantes" class="btn btn-secondary">Volver</a>
  </div>
</div>
