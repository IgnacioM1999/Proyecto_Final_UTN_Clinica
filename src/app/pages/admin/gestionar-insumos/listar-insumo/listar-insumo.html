<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Listar Insumo</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="card shadow p-4">
    <div class="mb-3 d-flex align-items-center gap-2">
      <label for="nombreInsumo" class="form-label fw-bold mb-0">Nombre Insumo:</label>
      <input type="text" id="nombreInsumo" [(ngModel)]="nombreInsumoFiltro" class="form-control"
        style="max-width: 200px;">

      <button class="btn btn-primary" (click)="filtrarInsumo()">Filtrar</button>
      <button class="btn btn-secondary" (click)="limpiarFiltroInsumo()">Limpiar</button>
    </div>
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-warning text-center">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Cantidad</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let insumo of insumosFiltrados">
          <td>{{ insumo.idInsumos }}</td>
          <!-- Nombre -->
          <td>{{insumo.nombre}}</td>
          <!-- Descripcion -->
          <td>{{insumo.descripcion}}</td>
          <!-- Cantidad -->
          <td>{{insumo.cantidad}}</td>
        </tr>
        <tr *ngIf="insumosBack.length === 0">
          <td colspan="4" class="text-center text-muted">No hay insumos cargados</td>
        </tr>
        <tr *ngIf="insumosBack.length > 0 && insumosFiltrados.length === 0">
          <td colspan="4" class="text-center text-muted">No hay insumos con el filtro ingresado</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-insumos" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-2"></i> Volver
    </a>
  </div>
</div>
