    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a routerLink="/especialista" class="navbar-brand d-flex align-items-center">
            <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
                style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
        </a>

        <div class="position-absolute top-50 start-50 translate-middle">
            <span class="fw-bold fs-4 text-center">Mostrar Diagnostico</span>
        </div>

        <div class="d-flex align-items-center ms-auto">
            <a routerLink="/perfil" class="text-decoration-none">
                <img src="usuario.png" alt="Perfil" width="60" height="60">

<div class="container mt-4">
    <div class="card shadow p-4">
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Coincidencias</th>
                    <th>% Coincidencia</th>
                    <th>Seleccionar</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let sindrome of sindromes">
                    <td>{{ sindrome.descripcion }}</td>
                    <td>{{ sindrome.coincidencia }}</td>
                    <td>{{ sindrome.porcentajeCoincidencia | number:'1.0-0' }}%</td>
                    <td>
                        <input type="checkbox" [checked]="sindromeSeleccionado?.idSindrome === sindrome.idSindrome"
                            (change)="toggleSeleccion(sindrome, $event)">
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="text-center mt-4">
            <button class="btn btn-warning" (click)="abrirModal()">Otra opción</button>
        </div>
    </div>
    <div class="mt-5 d-flex justify-content-center gap-5">
        <button (click)="volver()" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </button>
        <button class="btn btn-primary"
            routerLink="/especialista/gestion-sesiones/registrar-sesion/registrar-cuestio/mostrar-sindromes/mostrar-tratamientos"
            [disabled]="!sindromeSeleccionado">
            Continuar <i class="bi bi-arrow-right"></i>
        </button>
    </div>
</div>
<!-- Modal para ingresar síndrome y tratamiento -->
<div class="modal fade" tabindex="-1"  #modalSindrome id="modalSindrome" aria-labelledby="modalSindromeLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title" id="modalSindromeLabel">Agregar otro síndrome</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="sindromeDescripcion" class="form-label fw-bold">Descripción del síndrome:</label>
          <textarea id="sindromeDescripcion" class="form-control" [(ngModel)]="nuevoSindrome" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label for="tratamientoDescripcion" class="form-label fw-bold">Tratamiento sugerido:</label>
          <textarea id="tratamientoDescripcion" class="form-control" [(ngModel)]="nuevoTratamiento" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal" (click)="cerrarModal()">Cancelar</button>
        <button class="btn btn-success" (click)="confirmarSindrome()">Confirmar</button>
      </div>
    </div>
  </div>
</div>
