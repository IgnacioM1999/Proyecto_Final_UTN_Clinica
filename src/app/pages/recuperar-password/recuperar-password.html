<div class="d-flex justify-content-center align-items-center login-bg">
    <div class="card shadow p-4"
        style="max-width: 600px; width: 100%; border-radius: 15px; margin-top: 50px; margin-bottom: 50px;">
        <form (ngSubmit)="confirmar()" #form="ngForm">

            <div class="text-center mb-3">
                <h1 class="h3 mb-3 fw-normal">Recuperar Contraseña</h1>
            </div>

            <div class="mb-3">
                <label for="nuevaPassword">Nueva contraseña</label>
                <input id="nuevaPassword" type="password" class="form-control" [(ngModel)]="nuevaPassword"
                    name="nuevaPassword" required minlength="3">
            </div>

            <button class="btn btn-success w-100 mt-3" type="submit" [disabled]="!form.form.valid">
                Confirmar
            </button>
            <button class="btn btn-secondary w-100 mt-3" (click)="volver()">Volver</button>
        </form>
    </div>
</div>
