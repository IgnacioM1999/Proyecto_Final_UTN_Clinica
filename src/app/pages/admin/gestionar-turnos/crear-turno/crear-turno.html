<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Crear turno</h1>
</div>
<div class="container mt-4">
  <!--<h2 class="mb-4 text-center">Crear Turno</h2>-->

  <div class="card shadow p-4">
    <!-- Selección de días -->
    <div class="mb-4">
      <label class="form-label fw-bold">Días disponibles</label>
      <div class="btn-group w-100" role="group" aria-label="Días de la semana">
        <input type="radio" class="btn-check" name="dia" id="lunes" autocomplete="off">
        <label class="btn btn-outline-primary" for="lunes">Lunes</label>

        <input type="radio" class="btn-check" name="dia" id="martes" autocomplete="off">
        <label class="btn btn-outline-primary" for="martes">Martes</label>

        <input type="radio" class="btn-check" name="dia" id="miercoles" autocomplete="off">
        <label class="btn btn-outline-primary" for="miercoles">Miércoles</label>

        <input type="radio" class="btn-check" name="dia" id="jueves" autocomplete="off">
        <label class="btn btn-outline-primary" for="jueves">Jueves</label>

        <input type="radio" class="btn-check" name="dia" id="viernes" autocomplete="off">
        <label class="btn btn-outline-primary" for="viernes">Viernes</label>
      </div>
    </div>

    <!-- Selección de hora -->
    <div class="mb-4">
      <label for="hora" class="form-label fw-bold">Hora</label>
      <input type="time" id="hora" class="form-control">
    </div>

    <!-- Selección de especialista -->
    <div class="mb-4">
      <label for="especialista" class="form-label fw-bold">Especialista</label>
      <select id="especialista" class="form-select">
        <option selected disabled>Seleccione un especialista</option>
        <option value="1">Dr. Juan Pérez</option>
        <option value="2">Lic. Ana Gómez</option>
        <option value="3">Dr. Carlos Rodríguez</option>
      </select>
    </div>

    <!-- Botón de acción -->
    <div class="text-end">
      <button class="btn btn-success">Guardar Turno</button>
    </div>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-turnos" class="btn btn-secondary">Volver</a>
  </div>
</div>
