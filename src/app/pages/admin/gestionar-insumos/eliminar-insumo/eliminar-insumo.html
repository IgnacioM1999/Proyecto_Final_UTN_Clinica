<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Eliminar insumo</h1>
</div>
<div class="container mt-4">
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Cantidad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let insumo of insumos">
        <td>{{ insumo.id }}</td>
        <td>{{ insumo.nombre }}</td>
        <td>{{ insumo.descripcion }}</td>
        <td>{{ insumo.cantidad }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="eliminarInsumo(insumo.id)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-secondary mt-3" routerLink="/admin/gestionar-insumos">
    Volver
  </button>
</div>
