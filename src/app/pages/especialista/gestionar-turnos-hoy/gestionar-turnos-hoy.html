<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/especialista" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Turnos del Día</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-striped table-bordered">
      <thead class="table-warning text-center">
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Estado</th>
          <th>Especialista</th>
          <th>Paciente</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let turno of turnosFiltrados">
          <td>{{ turno.idTurno }}</td>
          <td>{{ turno.fecha | date:'dd-MM-yyyy' }}</td>
          <td>{{ turno.horario }}</td>
          <td>{{ turno.estado }}</td>
          <td>{{ turno.nombreEspecialista }}</td>
          <td>
            <span *ngIf="turno.nombrePaciente && turno.nombrePaciente.trim() !== ''">
              <!--el metodo trim() de JS elimina los espacios en blanco al principio y al final del texto-->
              {{ turno.nombrePaciente }}
            </span>
            <span *ngIf="!turno.nombrePaciente || turno.nombrePaciente.trim() === ''" class="text-muted fst-italic">
              No asignado
            </span>
          </td>
        </tr>
        <tr *ngIf="turnos.length === 0">
          <td colspan="4" class="text-center text-muted">No hay turnos cargados</td>
        </tr>
      </tbody>
    </table>

  </div>
  <div class="mt-3">
    <a routerLink="/especialista" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-2"></i> Volver
    </a>
  </div>
</div>
