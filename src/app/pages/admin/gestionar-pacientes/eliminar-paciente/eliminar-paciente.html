<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Eliminar Paciente</h1>
</div>
<div class="container mt-4">
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>DNI</th>
        <th>Nombre y Apellido</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Contraseña</th>
        <th>Accion</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let paciente of pacientes">
        <td>{{ paciente.dni }}</td>
        <td>{{ paciente.nombreYapellido }}</td>
        <td>{{ paciente.usuario }}</td>
        <td>{{ paciente.email }}</td>
        <td>{{ paciente.contrasenia }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="eliminarPaciente(paciente.dni)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-secondary mt-3" routerLink="/admin/gestionar-pacientes">
    Volver
  </button>
</div>
