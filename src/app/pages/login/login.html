<div class="d-flex justify-content-center align-items-center vh-100 login-bg">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">

    <div class="text-center">
      <img class="mb-4" src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        width="100" height="100">
    </div>

    <h1 class=" text-center mb-3 fw-normal">Bienvenido</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" [(ngModel)]="usuario"
          name="usuario" required (input)="onInputChange()">
        <label for="floatingInput">Usuario</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" [(ngModel)]="password"
          name="password" required (input)="onInputChange()">
        <label for="floatingPassword">Contraseña</label>

        <div *ngIf="errorMessage" class="text-danger mt-1">
          {{ errorMessage }}
        </div>
      </div>

      <!--<div class="form-check text-start mb-3">
        <input class="form-check-input" type="checkbox" id="checkDefault" [(ngModel)]="remember" name="remember">
        <label class="form-check-label" for="checkDefault">
          Recuerdame
        </label>
      </div>-->

      <button class="btn btn-primary w-100 py-2" type="submit">Iniciar Sesión</button>

      <div class="text-center mt-3">
        <p class="mb-1">
          ¿No tienes cuenta?
          <a (click)="goToRegister()" class="login-link">Registrate</a>
        </p>
        <p>
          ¿Olvidaste tu contraseña?
          <a (click)="goToPassword()" class="login-link">Recuperarla</a>
        </p>
      </div>

    </form>
  </div>
</div>
