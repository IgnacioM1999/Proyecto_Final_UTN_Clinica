<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Modificar Turno</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-warning text-center">
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Estado</th>
          <th>Especialista</th>
          <th>Paciente</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let turno of turnos">
          <td>{{ turno.idTurno }}</td>

          <!-- Fecha -->
          <td>
            <input type="date" [(ngModel)]="turno.fecha" class="form-control form-control-sm">
          </td>

          <!-- Hora -->
          <td>
            <input type="time" [(ngModel)]="turno.horario" class="form-control form-control-sm text-center">
          </td>

          <!--Estado-->
          <td>
            <select [(ngModel)]="turno.estado" class="form-select form-select-sm">
              <option>Disponible</option>
              <option>Ocupado</option>
              <option>Cancelado</option>
            </select>
          </td>

          <!-- Especialista -->
          <td>
            <select class="form-select" [(ngModel)]="turno.dniEspecialista" name="especialista-{{ turno.idTurno }}">
              <option selected disabled>Seleccione un especialista</option>
              <option *ngFor="let esp of especialistas" [value]="esp.dniUsuario">
                {{ esp.nombreYApellido }}
              </option>
            </select>
          </td>

          <!--Paciente-->
          <td>
            {{ turno.nombrePaciente }}
          </td>

          <!-- Botón Guardar -->
          <td class="d-flex justify-content-center align-items-center">
            <button class="btn btn-success btn-sm" (click)="guardarTurno(turno)">
              Guardar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-3">
    <a routerLink="/admin/gestionar-turnos" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-2"></i> Volver
    </a>
  </div>
</div>
