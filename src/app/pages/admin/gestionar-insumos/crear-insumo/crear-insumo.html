    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
            <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"

        <div class="position-absolute top-50 start-50 translate-middle">
            <span class="fw-bold fs-4 text-center">Gestion de Insumos</span>
        </div>

        <div class="d-flex align-items-center ms-auto">

<div class="container mt-4">
    <div class="card shadow p-4">
        <form (ngSubmit)="guardarInsumo()">

            <!-- Nombre-->
            <div class="mb-4">
                <label for="nombre" class="form-label fw-bold">Nombre</label>
                <input type="text" id="nombre" class="form-control" [(ngModel)]="nuevoInsumo.nombre" name="nombre"
                    required>
            </div>

            <!-- Descripcion -->
            <div class="mb-4">
                <label for="descripcion" class="form-label fw-bold">Descripcion</label>
                <input type="text" id="descripcion" class="form-control" [(ngModel)]="nuevoInsumo.descripcion"
                    name="descripcion" maxlength="200" required>
                <div *ngIf="nuevoInsumo.descripcion.length > 200" class="text-danger mt-1">
                    Máximo 200 caracteres permitidos (actual: {{ nuevoInsumo.descripcion.length }})
                </div>
            </div>

            <!-- Selección de cantidad -->
            <div class="mb-4">
                <label for="cantidad" class="form-label fw-bold">Cantidad</label>
                <input type="number" id="cantidad" class="form-control" [(ngModel)]="nuevoInsumo.cantidad"
                    name="cantidad" required>
            </div>

            <!-- Consumible -->
            <div class="mb-4">
                <label for="consumible" class="form-label fw-bold">Consumible</label>
                <select id="consumible" class="form-select" [(ngModel)]="nuevoInsumo.consumible" name="consumible"
                    required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>

            <!--Botones-->
            <div class="d-flex justify-content-between">
                <a routerLink="/admin/gestionar-insumos" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
                <button class="btn btn-success" type="submit">
                    <i class="bi bi-check-circle"></i> Guardar Insumo
                </button>
            </div>
        </form>
    </div>
</div>
