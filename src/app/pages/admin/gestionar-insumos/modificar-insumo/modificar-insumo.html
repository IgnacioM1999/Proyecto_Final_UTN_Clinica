<div class="p-5 bg-primary text-white text-center">
    <h1 class="fw-bold">Modificar insumo</h1>
</div>
<div class="container mt-4">
  <div class="card shadow p-4">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Cantidad</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let insumo of insumos">
          <td>{{ insumo.id }}</td>

          <!-- Nombre -->
          <td>
            <input type="text" [(ngModel)]="insumo.nombre" class="form-control">
          </td>

          <!-- Descripcion -->
          <td>
            <input type="text" [(ngModel)]="insumo.descripcion" class="form-control">
          </td>

          <!-- Cantidad -->
          <td>
            <input type="number" [(ngModel)]="insumo.cantidad" class="form-control">
          </td>

          <!-- Botón Guardar -->
          <td>
            <button class="btn btn-success btn-sm" (click)="guardarInsumo(insumo)">
              Guardar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón Volver -->
  <div class="mt-3">
    <a routerLink="/admin/gestionar-insumos" class="btn btn-secondary">Volver</a>
  </div>
</div>
