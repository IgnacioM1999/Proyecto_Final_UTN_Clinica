<div class="fondoPantalla">
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a routerLink="/paciente" class="navbar-brand d-flex align-items-center">
                <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
                    style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
            </a>

            <div class="position-absolute top-50 start-50 translate-middle">
                <span class="fw-bold fs-4 text-center">Agendar Turno</span>
            </div>

            <div class="d-flex align-items-center ms-auto">
                <a routerLink="/perfil" class="text-decoration-none">
                    <img src="usuario.png" alt="Perfil" width="60" height="60">
                </a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card shadow p-4" style="width: 800px; margin: 0 auto;">
            <div class="mb-3 d-flex align-items-center gap-2">
                <label for="fechaFiltro" class="form-label fw-bold mb-0">Filtrar por fecha:</label>
                <input type="date" id="fechaFiltro" [(ngModel)]="fechaFiltro" class="form-control"
                    style="max-width: 200px;">
                <button class="btn btn-primary" (click)="filtrarPorFecha()">Filtrar</button>
                <button class="btn btn-secondary" (click)="limpiarFiltro()">Limpiar</button>
            </div>
            <div style="width: 500px; margin: 0 auto;">
                <table class="table table-striped table-bordered">
                    <thead class="table-warning text-center">
                        <tr>
                            <th style="width: 70px;">ID</th>
                            <th style="width: 150px;">Fecha</th>
                            <th>Hora</th>
                            <th style="width: 120px;">Seleccionar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let turno of turnosFiltrados">
                            <td class="text-center align-middle">{{ turno.idTurno }}</td>
                            <td class="text-center align-middle">{{ turno.fecha | date:'dd-MM-yyyy' }}</td>
                            <td class="text-center align-middle">{{ turno.horario }}</td>
                            <td class="text-center align-middle">
                                <input class="form-check-input" type="checkbox"
                                    [checked]="turnoIdSeleccionado === turno.idTurno"
                                    (change)="seleccionarTurno(turno.idTurno)">
                            </td>
                        </tr>
                        <tr *ngIf="turnos.length === 0">
                            <td colspan="7" class="text-center text-muted">No hay turnos cargados</td>
                        </tr>
                        <tr *ngIf="turnos.length > 0 && turnosFiltrados.length === 0">
                            <td colspan="7" class="text-center text-muted">No hay turnos para la fecha seleccionada</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-5 d-flex justify-content-center gap-5">
            <button class="btn btn-secondary" routerLink="/paciente">
                <i class="bi bi-arrow-left me-2"></i>Volver
            </button>
            <button class="btn btn-success" [disabled]="!turnoIdSeleccionado" (click)="confirmarTurno()">
                Confirmar <i class="bi bi-check2-circle"></i>
            </button>
        </div>
    </div>
    <footer>
        Dirección: Mendoza 1955 - Rosario - Santa Fe | Número: 341 590 2334 | Correo:  clinicaAcupuntura@gmail.com
    </footer>
</div>
