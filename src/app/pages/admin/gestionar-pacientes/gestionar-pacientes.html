<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<!-- Título -->
<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Gestion de Pacientes</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container py-5">
  <!-- Opciones -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4 justify-content-center">

    <!-- Modificar Paciente -->
    <div class="col">
      <div class="card h-100 shadow-sm text-center">
        <div class="card-body">
          <i class="bi bi-pencil-square display-4 text-warning mb-3"></i>
          <h5 class="card-title">Modificar Pacientes</h5>
          <p class="card-text">Edita la información de un paciente existente.</p>
          <button class="btn btn-warning w-100 text-white"
            routerLink="/admin/gestionar-pacientes/modificar-paciente">Ir</button>
        </div>
      </div>
    </div>

    <!-- Eliminar Paciente -->
    <div class="col">
      <div class="card h-100 shadow-sm text-center">
        <div class="card-body">
          <i class="bi bi-trash3 display-4 text-danger mb-3"></i>
          <h5 class="card-title">Eliminar Pacientes</h5>
          <p class="card-text">Da de baja a un paciente.</p>
          <button class="btn btn-danger w-100" routerLink="/admin/gestionar-pacientes/eliminar-paciente">Ir</button>
        </div>
      </div>
    </div>

    <!-- Listar Pacientes -->
    <div class="col">
      <div class="card h-100 shadow-sm text-center">
        <div class="card-body">
          <i class="bi bi-list-ul display-4 text-info mb-3"></i>
          <h5 class="card-title">Listar Pacientes</h5>
          <p class="card-text">Consulta los pacientes registrados.</p>
          <button class="btn btn-info w-100 text-white"
            routerLink="/admin/gestionar-pacientes/listar-paciente">Ir</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Botón Volver -->
  <div class="mt-5 text-center">
    <button class="btn btn-secondary btn-lg px-5" (click)="volver()">
      <i class="bi bi-arrow-left me-2"></i> Volver
    </button>
  </div>
</div>
