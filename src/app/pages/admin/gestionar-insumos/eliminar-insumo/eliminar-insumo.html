<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3" style="background-color: rgb(252, 195, 73);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a routerLink="/admin" class="navbar-brand d-flex align-items-center">
      <img src="https://gwongzaukungfu.com/wp-content/uploads/2018/06/Tai-Ji-Tu-350x348.jpg" alt="Logo"
        style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 8px;">
    </a>

    <div class="position-absolute top-50 start-50 translate-middle">
      <span class="fw-bold fs-4 text-center">Eliminar Insumo</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <a routerLink="/perfil" class="text-decoration-none">
        <img src="usuario.png" alt="Perfil" width="60" height="60">
      </a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="card shadow p-4">

    <table class="table table-striped table-bordered">
      <thead class="table-warning text-center">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Cantidad</th>
          <th>Accion</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let insumo of insumosBack">
          <td>{{ insumo.idInsumos }}</td>
          <td>{{ insumo.nombre }}</td>
          <td>{{ insumo.descripcion }}</td>
          <td>{{ insumo.cantidad }}</td>
          <td class="d-flex justify-content-center align-items-center">
            <button class="btn btn-danger btn-sm" (click)="eliminarInsumo(insumo.idInsumos)">
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="insumosBack.length === 0">
          <td colspan="5" class="text-center text-muted">No hay insumos cargados</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="mt-3">
    <a routerLink="/admin/gestionar-insumos" class="btn btn-secondary">
      <i class="bi bi-arrow-left me-2"></i> Volver
    </a>
  </div>
</div>
