<div class="container mt-4">
  <h3 class="mb-3">Listado de Pasantes</h3>
  <table class="table table-striped table-bordered" *ngIf="pasantes.length > 0; else noData">
    <thead class="table-dark">
      <tr>
        <th>Legajo</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Código Usuario</th>
        <th>Acciones</th>
      </tr>
   
    </thead>
    <tbody>
      <tr *ngFor="let p of pasantes">
        <td>{{ p.legajo }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.apellido }}</td>
        <td>{{ p.email }}</td>
        <td>{{ p.codigoUsuario }}</td>
        <td>
          
         <button class="btn btn-danger btn-sm" (click)="eliminarPasante(p.legajo)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noData>
    <div class="alert alert-info">No hay pasantes registrados todavía.</div>
  </ng-template>
</div>
